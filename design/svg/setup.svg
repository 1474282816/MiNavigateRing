xt><text x="24" y="699.04" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#617168" text-anchor="start"><tspan x="24" dy="0">只在需要时引导调整后台设置。</tspan></text><rect x="0" y="764" width="390" height="80" rx="0" fill="#FFFFFF"/><svg x="106" y="776" width="21" height="21" viewBox="0 0 84 84"><path d="M8 37 40 9l32 28M19 32v39h42V32M32 71V49h16v22" fill="none" stroke="#246442" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="116.5" y="812.87" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#246442" text-anchor="middle"><tspan x="116.5" dy="0">导航</tspan></text><svg x="263" y="776" width="21" height="21" viewBox="0 0 84 84"><path d="M40 26a14 14 0 1 0 0 28 14 14 0 0 0 0-28ZM33 7h14l3 12 11 6 12-3 7 12-9 9v12l9 9-7 12-12-3-11 6-3 12H33l-3-12-11-6-12 3-7-12 9-9V43l-9-9 7-12 12 3 11-6 3-12Z" fill="none" stroke="#617168" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="273.5" y="812.87" font-family="Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#617168" text-anchor="middle"><tspan x="273.5" dy="0">设置</tspan></text><rect x="139" y="827" width="112" height="4" rx="2" fill="#17261E"/></svg>